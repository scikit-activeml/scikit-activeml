<svg xmlns="http://www.w3.org/2000/svg"
     class="skaml-structure" width="553" height="704" viewBox="0 0 553 704"
     aria-labelledby="structure-title structure-description">
  <title id="structure-title">Base classes of scikit-activeml</title>
  <desc id="structure-description">
    An inheritance tree. scikit-learn's BaseEstimator is the root. Its
    subclasses are SkactivemlClassifier, which also inherits ClassifierMixin,
    SkactivemlRegressor, which also inherits RegressorMixin, QueryStrategy,
    and BudgetManager. ClassFrequencyEstimator inherits from
    SkactivemlClassifier, and ProbabilisticRegressor from SkactivemlRegressor.
    QueryStrategy has the subclasses PoolQueryStrategy and
    SingleAnnotatorStreamQueryStrategy. PoolQueryStrategy has the subclasses
    SingleAnnotatorPoolQueryStrategy and MultiAnnotatorPoolQueryStrategy.
    SingleAnnotatorStreamQueryStrategy uses a BudgetManager. Each class links
    to its API reference.
  </desc>

  <!-- The page "Developing Components" embeds this file inline, so that text
       and frames follow the theme colors. Fallbacks apply when the file is
       opened directly. Style rules and ids carry a prefix because they apply
       to the whole page. Colors follow concepts-pool.svg. Released
       documentation loads scikit-activeml-structure.png from master, so that
       file stays unchanged. -->
  <defs>
    <style>
      .skaml-structure {
        font-family: var(--pst-font-family-monospace, monospace);
        font-size: 18px;
        fill: var(--pst-color-text-base, #222832);
      }
      .skaml-structure a { text-decoration: none; }
      .skaml-structure-class {
        fill: #07aee6; fill-opacity: .12;
        stroke: #07aee6; stroke-opacity: .6; stroke-width: 1.5;
      }
      .skaml-structure-external {
        fill: var(--pst-color-surface, #f3f4f5);
        stroke: var(--pst-color-border, #d1d5da);
        stroke-width: 1.5;
      }
      .skaml-structure a:hover rect,
      .skaml-structure a:focus rect { stroke-opacity: 1; stroke-width: 2.5; }
      .skaml-structure-tag { font-size: 15px; }
      .skaml-structure-note {
        font-family: var(--pst-font-family-base, system-ui, sans-serif);
        font-size: 16px;
        fill: var(--pst-color-text-muted, #48566b);
      }
      .skaml-structure-line {
        fill: none; stroke: #8c8c8c; stroke-width: 2; stroke-linejoin: round;
      }
      .skaml-structure-uses { stroke-dasharray: 7 5; }
    </style>
    <marker id="structure-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 L2.5 4 Z" fill="#8c8c8c"/>
    </marker>
  </defs>

