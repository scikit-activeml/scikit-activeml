<svg xmlns="http://www.w3.org/2000/svg"
     class="skaml-concepts" width="640" height="680" viewBox="0 0 640 680"
     role="img" aria-labelledby="concepts-pool-title concepts-pool-description">
  <title id="concepts-pool-title">Components of pool-based active learning</title>
  <desc id="concepts-pool-description">
    Data X and y connect to an estimator, a query strategy, and an annotator.
    Filled blue markers have observed labels. Hollow markers have missing
    labels. The pool shows samples in feature space, and a callout connects
    X[i] and y[i] to one sample. Candidate samples go to query(...). The
    annotator supplies new labels for the queried samples. Data go to the
    estimator through fit(X, y). Prediction methods include predict(...) and
    predict_proba(...), as supported. Their output informs selection when
    used by the query strategy.
  </desc>

  <!-- The Concepts page embeds this file and concepts-stream.svg inline, so
       text and frames follow the theme colors. Fallbacks apply when the file
       is opened directly. Style rules and ids carry a prefix because they
       apply to the whole page. Both files repeat the shared components and
       style rules, so keep them in sync. Shapes and colors follow the
       tutorial-*.svg pictograms. -->
  <defs>
    <style>
      .skaml-concepts {
        font-family: var(--pst-font-family-base, system-ui, sans-serif);
        font-size: 22px;
        text-anchor: middle;
        fill: var(--pst-color-text-base, #222832);
      }
      .skaml-panel-title { font-size: 30px; font-weight: 600; }
      .skaml-component-label { font-size: 23px; font-weight: 600; }
      .skaml-small-label { font-size: 19px; fill: var(--pst-color-text-muted, #48566b); }
      .skaml-code {
        font-family: var(--pst-font-family-monospace, monospace);
        font-size: 19px;
        font-weight: normal;
      }
      .skaml-code-heading { font-size: 22px; }
      .skaml-left { text-anchor: start; }
      .skaml-right { text-anchor: end; }
      .skaml-frame {
        fill: var(--pst-color-surface, #f3f4f5);
        stroke: var(--pst-color-border, #d1d5da);
        stroke-width: 1.5;
      }
      .skaml-node {
        fill: #07aee6; fill-opacity: .12;
        stroke: #07aee6; stroke-opacity: .6; stroke-width: 1.5;
      }
      .skaml-connection { fill: none; stroke: #8c8c8c; stroke-width: 2; }
      .skaml-optional { stroke-dasharray: 7 5; }
      .skaml-axis { fill: none; stroke: #8c8c8c; stroke-width: 1.6; }
      .skaml-leader { fill: none; stroke: #8c8c8c; stroke-width: 1.3; }
      .skaml-labeled { fill: #2a7fff; stroke: #8c8c8c; stroke-width: 1.2; }
      .skaml-unlabeled { fill: none; stroke: #8c8c8c; stroke-width: 1.8; }
    </style>
    <marker id="concepts-pool-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 L2.5 4 Z" fill="#8c8c8c"/>
    </marker>
  </defs>

  <text class="skaml-panel-title" x="320" y="48">Pool-based Active Learning</text>

  <rect class="skaml-frame" x="40" y="90" width="580" height="260" rx="14"/>
  <text class="skaml-component-label" x="330" y="124">Data <tspan class="skaml-code skaml-code-heading">(X, y)</tspan></text>
  <!-- Fill encodes label availability, not a particular target type. -->
  <circle class="skaml-labeled" cx="190" cy="325" r="6"/>
  <text class="skaml-small-label skaml-left" x="205" y="331">labeled</text>
  <circle class="skaml-unlabeled" cx="350" cy="325" r="6"/>
  <text class="skaml-small-label skaml-left" x="365" y="331">unlabeled</text>

  <path class="skaml-axis" d="M82 281 V150" marker-end="url(#concepts-pool-arrow)"/>
  <path class="skaml-axis" d="M82 281 H590" marker-end="url(#concepts-pool-arrow)"/>
  <text class="skaml-small-label" x="603" y="288">x<tspan baseline-shift="sub" font-size="14">1</tspan></text>
  <text class="skaml-small-label" x="68" y="157">x<tspan baseline-shift="sub" font-size="14">2</tspan></text>

  <circle class="skaml-labeled" cx="108" cy="245" r="6"/>
  <circle class="skaml-unlabeled" cx="139" cy="189" r="6"/>
  <circle class="skaml-unlabeled" cx="181" cy="240" r="6"/>
  <circle class="skaml-labeled" cx="214" cy="202" r="6"/>
  <circle class="skaml-labeled" cx="242" cy="263" r="6"/>
  <circle class="skaml-unlabeled" cx="300" cy="236" r="6"/>
  <circle class="skaml-unlabeled" cx="345" cy="202" r="6"/>
  <circle class="skaml-labeled" cx="390" cy="249" r="6"/>
  <circle class="skaml-unlabeled" cx="432" cy="174" r="6"/>
  <circle class="skaml-labeled" cx="485" cy="227" r="6"/>
  <circle class="skaml-unlabeled" cx="538" cy="187" r="6"/>
  <circle class="skaml-unlabeled" cx="569" cy="258" r="6"/>

  <path class="skaml-leader" d="M220 198 L255 171 H272"/>
  <text class="skaml-code skaml-left" x="280" y="177">X[i], y[i]</text>

  <rect class="skaml-node" x="40" y="410" width="260" height="160" rx="12"/>
  <text class="skaml-component-label" x="170" y="445">Estimator</text>
  <text class="skaml-code" x="170" y="480">predict(...)</text>
  <text class="skaml-code" x="170" y="513">predict_proba(...)</text>
  <text class="skaml-small-label" x="170" y="547">as supported</text>

  <rect class="skaml-node" x="420" y="410" width="200" height="110" rx="12"/>
  <text class="skaml-component-label" x="520" y="445">Query strategy</text>
  <text class="skaml-code" x="520" y="486">query(...)</text>

  <g transform="translate(490 556)">
    <circle cx="30" cy="18" r="14" fill="#2a7fff"/>
    <rect x="8" y="38" width="44" height="30" rx="12" fill="#2a7fff"/>
    <path d="M58 3 C58 -10 106 -10 106 9 C106 24 86 29 72 23 L58 31 L62 18 C59 14 58 9 58 3 Z"
          fill="#f8a661" fill-opacity=".28" stroke="#f8a661" stroke-width="2.5"/>
    <text class="skaml-code" x="82" y="15">y</text>
  </g>
  <text class="skaml-component-label" x="520" y="654">Annotator</text>

  <path class="skaml-connection" d="M170 350 V408" marker-end="url(#concepts-pool-arrow)"/>
  <text class="skaml-code skaml-left" x="188" y="388">fit(X, y)</text>

  <path class="skaml-connection" d="M520 350 V408" marker-end="url(#concepts-pool-arrow)"/>
  <text class="skaml-code skaml-right" x="502" y="388">candidates</text>

  <path class="skaml-connection skaml-optional" d="M300 470 H418" marker-end="url(#concepts-pool-arrow)"/>
  <text class="skaml-small-label" x="360" y="451">if used</text>

  <path class="skaml-connection" d="M520 520 V555" marker-end="url(#concepts-pool-arrow)"/>
  <text class="skaml-small-label skaml-right" x="499" y="549">query labels</text>

  <path class="skaml-connection" d="M498 608 H26 Q14 608 14 596 V252 Q14 240 26 240 H38"
        marker-end="url(#concepts-pool-arrow)"/>
  <text x="215" y="597">new labels</text>
</svg>
