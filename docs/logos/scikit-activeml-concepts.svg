<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1320" height="680" viewBox="0 0 1320 680"
     role="img" aria-labelledby="concepts-title concepts-description">
  <title id="concepts-title">Components of pool-based and stream-based active learning</title>
  <desc id="concepts-description">
    Each panel connects data X and y, a query strategy, an annotator, and an
    estimator. Filled blue markers have observed labels. Hollow markers have
    missing labels. A callout connects X[i] and y[i] to one sample.
    The pool shows samples in feature space. The stream shows samples in
    arrival order, with current candidates highlighted separately from earlier
    samples. Candidate samples go to query(...). Annotators supply new labels
    for selected samples. Data go to the estimator through fit(X, y).
    Prediction methods include predict(...) and predict_proba(...), as
    supported. Their output informs selection when used by the query strategy.
    The stream query strategy also exposes update(...) to advance its state.
  </desc>

  <!-- Editable text and shared vector symbols.
       Colors and typography follow the existing graphics in docs/logos. -->
  <defs>
    <style>
      text {
        font-family: "CMU Serif", "Latin Modern Roman", "Nimbus Roman", "Times New Roman", serif;
        font-size: 24px;
        text-anchor: middle;
        fill: #000000;
      }
      .panel-title { font-size: 31px; }
      .component-label { font-size: 28px; }
      .small-label { font-size: 22px; fill: #5c5c5c; }
      .code {
        font-family: "CMU Typewriter Text", "Nimbus Mono PS", monospace;
        font-size: 22px;
        font-style: normal;
      }
      .code-heading { font-size: 25px; }
      .left { text-anchor: start; }
      .right { text-anchor: end; }
      .node { fill: #07aee6; fill-opacity: .16; stroke: #000000; stroke-width: 2; }
      .connection { fill: none; stroke: #000000; stroke-width: 2.3; marker-end: url(#arrow); }
      .optional { stroke: #5c5c5c; stroke-dasharray: 8 6; marker-end: url(#gray-arrow); }
      .labeled { fill: #2a7fff; stroke: #5c5c5c; stroke-width: 1.4; }
      .unlabeled { fill: #ffffff; stroke: #5c5c5c; stroke-width: 1.7; }
      .plot { fill: none; stroke: #5c5c5c; stroke-width: 1.7; marker-end: url(#gray-arrow); }
      .leader { fill: none; stroke: #5c5c5c; stroke-width: 1.3; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 L2.5 4 Z" fill="#000000"/>
    </marker>
    <marker id="gray-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 4 L0 8 L2.5 4 Z" fill="#5c5c5c"/>
    </marker>

    <g id="data-frame">
      <rect x="40" y="90" width="580" height="260" rx="12"
            fill="#07aee6" fill-opacity=".07" stroke="#000000" stroke-width="2"/>
      <text class="component-label" x="330" y="124">Data <tspan class="code code-heading">(X, y)</tspan></text>
      <!-- Fill encodes label availability, not a particular target type. -->
      <circle class="labeled" cx="190" cy="325" r="6"/>
      <text class="small-label left" x="205" y="332">labeled</text>
      <circle class="unlabeled" cx="350" cy="325" r="6"/>
      <text class="small-label left" x="365" y="332">unlabeled</text>
    </g>

    <g id="estimator-node">
      <rect class="node" x="40" y="410" width="260" height="160" rx="10"/>
      <text class="component-label" x="170" y="445">Estimator</text>
      <text class="code" x="170" y="480">predict(...)</text>
      <text class="code" x="170" y="513">predict_proba(...)</text>
      <text class="small-label" x="170" y="547">as supported</text>
    </g>

    <g id="query-strategy-frame">
      <rect class="node" x="420" y="410" width="200" height="110" rx="10"/>
      <text class="component-label" x="520" y="445">Query strategy</text>
    </g>

    <g id="annotator-symbol">
      <circle cx="30" cy="18" r="14" fill="#2a7fff"/>
      <rect x="10" y="37" width="40" height="29" rx="11" fill="#2a7fff"/>
      <path d="M58 3 C58 -10 106 -10 106 9 C106 24 86 29 72 23 L58 31 L62 18 C59 14 58 9 58 3 Z"
            fill="#f8a661" fill-opacity=".28" stroke="#f8a661" stroke-width="2.5"/>
      <text class="code" x="82" y="14">y</text>
    </g>

    <g id="shared-components">
      <use xlink:href="#data-frame"/>
      <use xlink:href="#estimator-node"/>
      <use xlink:href="#query-strategy-frame"/>
      <use xlink:href="#annotator-symbol" x="490" y="556"/>
      <text class="component-label" x="520" y="652">Annotator</text>

      <path class="connection" d="M170 350 V408"/>
      <text class="code left" x="188" y="388">fit(X, y)</text>

      <path class="connection" d="M520 350 V408"/>
      <text class="code right" x="502" y="388">candidates</text>

      <path class="connection optional" d="M300 470 H418"/>
      <text class="small-label" x="360" y="451">if used</text>

      <path class="connection" d="M520 520 V555"/>

      <path class="connection" d="M498 608 H26 Q14 608 14 596 V252 Q14 240 26 240 H38"/>
      <text x="215" y="597">new labels</text>
    </g>
  </defs>

  <rect width="1320" height="680" fill="#ffffff"/>
  <path d="M660 78 V662" stroke="#e6e6e6" stroke-width="2"/>

  <g id="pool-based-active-learning" transform="translate(20 0)">
    <text class="panel-title" x="320" y="48">Pool-based Active Learning</text>
    <use xlink:href="#shared-components"/>

    <g id="pool-data">
      <path class="plot" d="M82 281 V150"/>
      <path class="plot" d="M82 281 H590"/>
      <text class="small-label" x="601" y="288">x<tspan baseline-shift="sub" font-size="15">1</tspan></text>
      <text class="small-label" x="69" y="157">x<tspan baseline-shift="sub" font-size="15">2</tspan></text>

      <circle class="labeled" cx="108" cy="245" r="6"/>
      <circle class="unlabeled" cx="139" cy="189" r="6"/>
      <circle class="unlabeled" cx="181" cy="240" r="6"/>
      <circle class="labeled" cx="214" cy="202" r="6"/>
      <circle class="labeled" cx="242" cy="263" r="6"/>
      <circle class="unlabeled" cx="300" cy="236" r="6"/>
      <circle class="unlabeled" cx="345" cy="202" r="6"/>
      <circle class="labeled" cx="390" cy="249" r="6"/>
      <circle class="unlabeled" cx="432" cy="174" r="6"/>
      <circle class="labeled" cx="485" cy="227" r="6"/>
      <circle class="unlabeled" cx="538" cy="187" r="6"/>
      <circle class="unlabeled" cx="569" cy="258" r="6"/>

      <path class="leader" d="M220 198 L255 171 H272"/>
      <text class="code left" x="280" y="177">X[i], y[i]</text>
    </g>
    <text class="code" x="520" y="486">query(...)</text>
    <text class="small-label right" x="499" y="549">query labels</text>
  </g>

  <g id="stream-based-active-learning" transform="translate(680 0)">
    <text class="panel-title" x="320" y="48">Stream-based Active Learning</text>
    <use xlink:href="#shared-components"/>

    <g id="stream-data">
      <!-- Only the newest arrivals are candidates for the current query. -->
      <rect x="462" y="147" width="110" height="131" rx="8"
            fill="#f8a661" fill-opacity=".16" stroke="#f8a661" stroke-width="2"/>
      <path class="plot" d="M82 281 V150"/>
      <path class="plot" d="M82 281 H590"/>
      <text class="small-label" x="601" y="288">t</text>
      <text class="small-label" x="69" y="157">x</text>

      <circle class="labeled" cx="110" cy="226" r="6"/>
      <circle class="unlabeled" cx="152" cy="190" r="6"/>
      <circle class="labeled" cx="194" cy="252" r="6"/>
      <circle class="labeled" cx="242" cy="205" r="6"/>
      <circle class="unlabeled" cx="292" cy="241" r="6"/>
      <circle class="unlabeled" cx="337" cy="252" r="6"/>
      <circle class="labeled" cx="388" cy="220" r="6"/>
      <circle class="unlabeled" cx="426" cy="253" r="6"/>
      <circle class="unlabeled" cx="495" cy="205" r="6"/>
      <circle class="unlabeled" cx="550" cy="244" r="6"/>

      <path class="leader" d="M246 200 L264 171 H276"/>
      <text class="code left" x="284" y="177">X[i], y[i]</text>

      <text class="small-label" x="257" y="306">earlier samples</text>
      <text class="small-label" x="520" y="306">new arrivals</text>
    </g>
    <text class="code" x="520" y="478">query(...)</text>
    <text class="code" x="520" y="507">update(...)</text>
    <text class="small-label right" x="499" y="549">query label</text>
  </g>
</svg>
