<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1240" height="336" viewBox="0 0 1240 336"
     role="img" aria-labelledby="title">
  <!-- README.rst shows this figure, and the documentation's home page
       includes that README section. GitHub and PyPI show it without
       the documentation's styles, so it has its own background and
       switches to dark colors by itself. It repeats the pictograms in
       docs/_static/strategy_filters/. Keep both in sync. -->
  <title id="title">The properties by which the Strategy Overview filters
    query strategies: task, target type, annotation type, selection
    principle, and pool batching.</title>
  <defs>
    <style>
      .axis { fill: none; stroke: #8c8c8c; stroke-width: 1.4; marker-end: url(#arrow); }
      .labeled { fill: #2a7fff; stroke: #8c8c8c; stroke-width: 1; }
      .unlabeled { fill: none; stroke: #8c8c8c; stroke-width: 1.6; }
      .query { fill: #f8a661; fill-opacity: .28; stroke: #f8a661; stroke-width: 2.2; }
      .boundary { stroke: #8c8c8c; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .tint { fill: #07aee6; fill-opacity: .10; }
      .density { fill: #8c8c8c; fill-opacity: .16; }
      .link { stroke: #8c8c8c; stroke-width: 1.1; }
      .positive { fill: #2a7fff; }
      .negative { fill: none; stroke: #2a7fff; stroke-width: 1.3; }
      .missing { fill: none; stroke: #8c8c8c; stroke-width: 1.2; stroke-dasharray: 2.5 2; }
      .queried { fill: none; stroke: #f8a661; stroke-width: 1.2; stroke-dasharray: 2.5 2; }
      .query-row { fill: #f8a661; fill-opacity: .14; stroke: #f8a661; stroke-width: 1.2; }
      .pair { stroke: #8c8c8c; stroke-width: 1.2; stroke-dasharray: 3 2.5; }
      .bubble { fill: #f8a661; fill-opacity: .28; stroke: #f8a661; stroke-width: 1.3; }
      .answer { font: bold 11px "Nimbus Mono PS", "Courier New", monospace; text-anchor: middle; fill: #8c8c8c; }
      .die { fill: none; stroke: #8c8c8c; stroke-width: 1.2; }
      .pip { fill: #8c8c8c; }
      .card { fill: #ffffff; stroke: #d0d7de; }
      .frame { fill: none; stroke: #d0d7de; stroke-width: 1.2; }
      .kicker { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
                letter-spacing: .06em; fill: #57606a; }
      .label { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
               text-anchor: middle; fill: #1f2328; }
      @media (prefers-color-scheme: dark) {
        .card { fill: #0d1117; stroke: #3d444d; }
        .frame { stroke: #3d444d; }
        .kicker { fill: #9198a1; }
        .label { fill: #e6edf3; }
      }
    </style>
    <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L6 2.5 L0 5 L1.5 2.5 Z" fill="#8c8c8c"/>
    </marker>
    <g id="annotator">
      <circle cx="0" cy="0" r="5.5"/>
      <rect x="-8.5" y="7" width="17" height="12" rx="5"/>
    </g>
  </defs>

