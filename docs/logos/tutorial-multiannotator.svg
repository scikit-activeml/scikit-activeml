<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="240" height="112" viewBox="0 0 240 112">
  <!-- Tutorial card pictogram in the style of the concepts-*.svg panels.
       Mid-tone colors on a transparent background suit light and dark mode. -->
  <defs>
    <style>
      .unlabeled { fill: none; stroke: #8c8c8c; stroke-width: 1.6; }
      .query { fill: #f8a661; fill-opacity: .28; stroke: #f8a661; stroke-width: 2.2; }
      .pair { stroke: #8c8c8c; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .bubble { fill: #f8a661; fill-opacity: .28; stroke: #f8a661; stroke-width: 1.8; }
      text {
        font-family: "CMU Typewriter Text", "Nimbus Mono PS", monospace;
        font-size: 14px;
        font-weight: bold;
        text-anchor: middle;
        fill: #8c8c8c;
      }
    </style>
    <g id="annotator">
      <circle cx="0" cy="0" r="7"/>
      <rect x="-11" y="10" width="22" height="15" rx="6"/>
    </g>
  </defs>

  <!-- Two selected sample-annotator pairs. The third annotator is not asked. -->
  <circle class="query" cx="56" cy="59" r="10"/>
  <circle class="unlabeled" cx="56" cy="59" r="5.5"/>
  <path class="pair" d="M68 53 L130 34"/>
  <path class="pair" d="M68 65 L130 92"/>

  <use xlink:href="#annotator" x="146" y="19" fill="#2a7fff"/>
  <path class="bubble" d="M162 13 c0 -13 34 -13 34 0 c0 11 -15 14 -25 10 l-10 5 l3 -9 c-1 -2 -2 -4 -2 -6 z"/>
  <text x="179" y="18">y</text>

  <use xlink:href="#annotator" x="146" y="79" fill="#2a7fff"/>
  <path class="bubble" d="M162 73 c0 -13 34 -13 34 0 c0 11 -15 14 -25 10 l-10 5 l3 -9 c-1 -2 -2 -4 -2 -6 z"/>
  <text x="179" y="78">y</text>

  <use xlink:href="#annotator" x="222" y="49" fill="#8c8c8c" fill-opacity=".55"/>
</svg>
