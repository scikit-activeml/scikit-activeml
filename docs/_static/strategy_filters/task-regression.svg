<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="120" height="64" viewBox="0 0 120 64">
  <!-- Strategy filter pictogram in the style of the tutorial-*.svg
       pictograms. Mid-tone colors on a transparent background suit
       light and dark mode. -->
  <defs>
    <style>
      .axis { fill: none; stroke: #8c8c8c; stroke-width: 1.4; marker-end: url(#arrow); }
      .labeled { fill: #2a7fff; stroke: #8c8c8c; stroke-width: 1; }
      .unlabeled { fill: none; stroke: #8c8c8c; stroke-width: 1.6; }
      .query { fill: #f8a661; fill-opacity: .28; stroke: #f8a661; stroke-width: 2.2; }
    </style>
    <marker id="arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L6 2.5 L0 5 L1.5 2.5 Z" fill="#8c8c8c"/>
    </marker>
  </defs>

  <!-- The query asks for the continuous label of an unlabeled sample. -->
  <path class="axis" d="M8 45 V3"/>
  <path class="axis" d="M8 45 H117"/>
  <path d="M14 36 C30 12 46 10 60 25 S90 42 112 14" fill="none" stroke="#07aee6" stroke-opacity=".18" stroke-width="11" stroke-linecap="round"/>
  <path d="M14 36 C30 12 46 10 60 25 S90 42 112 14" fill="none" stroke="#8c8c8c" stroke-width="1.6"/>
  <circle class="labeled" cx="24" cy="21" r="4.4"/>
  <circle class="labeled" cx="60" cy="25" r="4.4"/>
  <circle class="labeled" cx="98" cy="29" r="4.4"/>
  <path d="M80 45 V35" stroke="#f8a661" stroke-width="1.8" stroke-dasharray="3 2"/>
  <circle class="query" cx="80" cy="54" r="8.5"/>
  <circle class="unlabeled" cx="36" cy="54" r="4.4"/>
  <circle class="unlabeled" cx="58" cy="54" r="4.4"/>
  <circle class="unlabeled" cx="80" cy="54" r="4.4"/>
  <circle class="unlabeled" cx="104" cy="54" r="4.4"/>
</svg>
